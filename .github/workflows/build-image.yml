name: Build & Push Chatwoot Fork to GHCR

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Set image tag
        run: echo "IMAGE_TAG=ghcr.io/${{ secrets.GHCR_USERNAME }}/chatwoot-fork:latest" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_TAG .

      - name: Push image to GHCR
        run: docker push $IMAGE_TAG
